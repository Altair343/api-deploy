version: '3.8'
services:
  api_demo:
    image: fastapi:1.0.0
    env_file: .env
    restart: unless-stopped
    ports:
      - "8000:8000"
    networks:
      - api_network

  db_postgres:
    image: postgres:17
    container_name: db_postgres
    command: postgres -c 'max_connections=1000'
    env_file: .env-db
    # environment:
    #   POSTGRES_DB: library_book
    #   POSTGRES_USER: payrolluser
    #   POSTGRES_PASSWORD: payrolluser
    #   TZ: America/Mexico_City
    restart: unless-stopped
    ports:
      - "5432:5432"
    networks:
      - api_network
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    command:
      - redis-server
      - --appendonly
      - "no"
      - --maxmemory
      - "64mb"
      - --maxmemory-policy
      - "noeviction"
    networks:
      - api_network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

networks:
  api_network:
    driver: bridge

volumes:
  postgres_data: